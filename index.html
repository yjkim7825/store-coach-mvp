<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6A57">
<title>현장업무 코치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<style>
/* Layout: one phone-width column, sticky store header with role switch; manager view adds a tab strip. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E9EDE9; --ink:#18211D; --muted:#5B6862; --line:#D8DFDA;
  --accent:#1E6A57; --accent-soft:#DCEDE6; --on-accent:#FFFFFF;
  --ok:#2C7A4B; --ok-soft:#DDF0E3; --hold:#9A6408; --hold-soft:#FBEFD6; --risk:#B73A25; --risk-soft:#FBE3DD;
  --f-head:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#19201D; --sunk:#222B27; --ink:#E5ECE8; --muted:#9AA9A2; --line:#2D3833;
  --accent:#62C3A3; --accent-soft:#1D3A31; --on-accent:#0B1310;
  --ok:#74CF95; --ok-soft:#1C3325; --hold:#E6B24E; --hold-soft:#3A2E14; --risk:#F28068; --risk-soft:#3D211B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#19201D; --sunk:#222B27; --ink:#E5ECE8; --muted:#9AA9A2; --line:#2D3833;
  --accent:#62C3A3; --accent-soft:#1D3A31; --on-accent:#0B1310;
  --ok:#74CF95; --ok-soft:#1C3325; --hold:#E6B24E; --hold-soft:#3A2E14; --risk:#F28068; --risk-soft:#3D211B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.store{font-size:12.5px;color:var(--muted)}
.role{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;flex-shrink:0}
.role button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.role button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.count{font-family:var(--f-num);font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--risk);color:var(--surface);display:inline-grid;place-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs button{border:0;background:none;padding:6px 8px;border-radius:8px;font-size:13.5px;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}

main{padding-block:16px 140px}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.01em;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.hold{background:var(--hold-soft);color:var(--hold)}
.chip.risk{background:var(--risk-soft);color:var(--risk)}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--risk)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.sec-title h2{font-size:15px;font-weight:700}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 11px;font-size:15px;color:var(--ink)}
textarea{resize:vertical;min-height:80px}

/* staff chat */
.hello h2{font-size:20px;font-weight:700;margin-bottom:4px}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;text-align:left}
.thread{display:flex;flex-direction:column;gap:14px}
.q{align-self:flex-end;max-width:85%;background:var(--accent);color:var(--on-accent);padding:9px 13px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.a{align-self:stretch;background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.a .body{white-space:pre-wrap;overflow-wrap:anywhere}
.evid{border-top:1px dashed var(--line);padding-top:9px;display:flex;flex-direction:column;gap:6px}
.evid .lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.cite{background:var(--sunk);border-radius:8px;padding:7px 10px;font-size:13.5px}
.cite b{font-weight:700}
.cite .step{display:block;color:var(--muted);margin-top:2px}
.wait{background:var(--hold-soft);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.mgr{background:var(--accent-soft);border-radius:10px;padding:9px 11px}
.mgr .lbl{font-size:12px;font-weight:700;color:var(--accent)}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"..."}}

.composer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
.composer .wrap{display:flex;gap:8px;align-items:flex-end;padding-block:10px}
.composer textarea{min-height:44px;max-height:140px;flex:1;resize:none;border-radius:22px;padding:10px 16px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex-shrink:0}
.icon-btn.send{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.icon-btn.live{background:var(--risk);border-color:var(--risk);color:var(--surface)}
.icon-btn svg{width:20px;height:20px}
.note-bar{font-size:12px;color:var(--muted);text-align:center;padding-top:4px}

/* cards */
.card-item{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.card-item h3{font-size:15.5px;font-weight:600}
.card-item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);font-weight:700}
.steps-view{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:3px}
.missing{background:var(--hold-soft);color:var(--hold);border-radius:8px;padding:8px 10px;font-size:13px}
.confirm{background:var(--risk-soft);border-radius:8px;padding:8px 10px;font-size:13.5px}

/* metrics */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--f-num);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .s{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13.5px;z-index:20;max-width:90%}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>현장업무 코치</h1>
        <div class="store" id="storeName">한결커피 삼산점 · 예시 매장</div>
      </div>
      <div class="role" role="group" aria-label="화면 전환">
        <button id="roleStaff" aria-pressed="true">직원</button>
        <button id="roleAdmin" aria-pressed="false">관리자 <span class="count" id="adminCount" hidden>0</span></button>
      </div>
    </div>
    <nav class="tabs" id="adminTabs" hidden>
      <button data-tab="cards">업무카드 <span class="count" id="cDraft" hidden></span></button>
      <button data-tab="inbox">관리자 호출 <span class="count" id="cInbox" hidden></span></button>
      <button data-tab="fix">수정 후보 <span class="count" id="cFix" hidden></span></button>
      <button data-tab="metrics">지표</button>
    </nav>
  </div>
</header>

<main class="wrap" id="view"></main>
<div class="composer" id="composer" hidden>
  <div class="wrap">
    <button class="icon-btn" id="micBtn" aria-label="말로 질문하기" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <textarea id="askInput" rows="1" placeholder="모르는 업무를 물어보세요"></textarea>
    <button class="icon-btn send" id="sendBtn" aria-label="질문 보내기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</div>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") continue;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const now = () => Date.now();
function ago(t) {
  if (!t) return "";
  const s = Math.max(0, Math.round((now() - t) / 1000));
  if (s < 60) return "방금";
  if (s < 3600) return Math.floor(s / 60) + "분 전";
  if (s < 86400) return Math.floor(s / 3600) + "시간 전";
  return Math.floor(s / 86400) + "일 전";
}
function waitFor(t) { const m = Math.max(0, Math.round((now() - t) / 60000)); return m < 1 ? "방금부터" : m < 60 ? m + "분째" : Math.floor(m / 60) + "시간째"; }
function toast(msg) {
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}
const norm = (s) => String(s || "").toLowerCase().replace(/아이스/g, "ice").replace(/따뜻한|뜨거운|핫/g, "hot").replace(/[^0-9a-z가-힣]/g, "");
const use = (n) => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);

/* ---------- risk rules: AI never decides these ---------- */
const RISK_RULES = [
  { cat: "환불", re: /환불|결제\s*취소|취소해\s*달|돈\s*돌려|반품|보상|배상|차액\s*돌려/ },
  { cat: "위생·안전", re: /유통\s*기한|상했|상한|곰팡|이물|벌레|머리카락|화상|데었|다쳤|부상|베였|피\s*나|화재|불이\s*났|연기|가스|누전|감전|알레르기|알러지|식중독|배탈|미끄러|쓰러|응급|구급|위생\s*점검/ },
  { cat: "개인정보", re: /전화\s*번호|연락처|주소\s*알려|개인\s*정보|cctv|씨씨티비|녹화\s*영상|카드\s*번호|주민|신상/i },
];
function detectRisk(text) {
  for (const r of RISK_RULES) if (r.re.test(text)) return r.cat;
  return null;
}
const RISK_SCRIPT = {
  "환불": "환불과 보상은 AI가 판단하지 않아요. 현장 책임자에게 바로 알렸어요. 손님께는 \"담당자 확인 후 바로 안내드리겠습니다\"라고 말씀해 주세요.",
  "위생·안전": "위생·안전 문제는 AI가 판단하지 않아요. 현장 책임자에게 바로 알렸어요. 다친 사람이 있거나 위험하면 먼저 작업을 멈추고 주변에 알리세요.",
  "개인정보": "손님 개인정보와 영상은 AI가 다루지 않아요. 현장 책임자에게 바로 알렸어요. 확인 전에는 어떤 정보도 알려주지 마세요.",
};
const REASON_LABEL = { no_evidence: "근거 없음", risk: "", staff_request: "직원 요청" };

/* ---------- local fallback data (used only when the shared store is unavailable) ---------- */
const DEMO = {
  cards: [
    { id: "c-open", title: "오픈 준비 순서", situation: "오픈 근무 첫 30분", steps: ["출근하면 포스에서 출근 등록을 합니다.", "에스프레소 머신 전원을 켜고 15분 예열한 뒤 추출 테스트를 합니다. 2샷이 25~30초에 나오면 정상입니다.", "쇼케이스 온도가 3℃ 이하인지 확인하고 온도 기록지에 적습니다.", "디저트 라벨의 유통기한을 확인하고 앞에서부터 오래된 순으로 진열합니다.", "포스 시재 10만 원을 확인합니다."], caution: "추출 시간이 20초 미만이거나 35초를 넘으면 판매 전에 관리자에게 알립니다.", tags: ["오픈", "머신"], status: "approved", source: "voice", version: 2, createdAt: now() - 9 * 864e5, approvedAt: now() - 9 * 864e5 },
    { id: "c-ame", title: "아메리카노 만들기 (HOT/ICE)", situation: "가장 많이 나가는 음료", steps: ["모든 사이즈 기본 2샷입니다.", "HOT은 샷 위에 뜨거운 물 300ml를 붓습니다.", "ICE는 컵에 얼음을 가득 담고 물 250ml를 부은 뒤 샷을 올립니다.", "'연하게' 요청은 물을 50ml 더 넣고, '진하게' 요청은 샷 추가(+500원)로 받습니다."], caution: "", tags: ["레시피", "음료"], status: "approved", source: "text", version: 1, createdAt: now() - 9 * 864e5, approvedAt: now() - 9 * 864e5 },

async function put(coll, id, obj) {
  const rec = { ...obj, id };
  const i = S[coll].findIndex((x) => x.id === id);
  if (i >= 0) S[coll][i] = rec; else S[coll].push(rec);
  if (mode === "local") saveLocal();
  emit();
  if (db) {
    const { id: _drop, ...body } = rec;
    try { await db.collection(coll).doc(id).set(body); }
    catch (e) { handleWriteError(e); }
  }
}
async function patch(coll, id, obj) {
  const cur = S[coll].find((x) => x.id === id);
  if (!cur) return;
  return put(coll, id, { ...cur, ...obj });
}
async function remove(coll, id) {
  S[coll] = S[coll].filter((x) => x.id !== id);
  if (mode === "local") saveLocal();
  emit();
  if (db) { try { await db.collection(coll).doc(id).delete(); } catch (e) { handleWriteError(e); } }
}

}
async function aiAnswer(question, cards) {

[승인된 업무카드]

function keywordAnswer(question, cards) {
  // fallback when AI is unavailable: show the best-matching step verbatim, or hold
  const qn = norm(question);
  const grams = new Set();
  for (let i = 0; i < qn.length - 1; i++) grams.add(qn.slice(i, i + 2));
  const hits = (t) => { const tn = norm(t); let sc = 0; grams.forEach((g) => { if (tn.includes(g)) sc++; }); return sc; };
  let best = null;
  for (const c of cards) {
    const sc = hits([c.title, c.situation, ...(c.steps || [])].join(" ")) + hits(c.title);
    if (!best || sc > best.sc) best = { sc, c };
  }
  if (!best || best.sc < Math.max(3, grams.size * 0.3)) return { status: "insufficient", answer: "", citations: [] };
  let step = null, stepSc = 0;
  (best.c.steps || []).forEach((t, i) => { const sc = hits(t); if (sc > stepSc) { stepSc = sc; step = i + 1; } });
  return { status: "answered", answer: step ? best.c.steps[step - 1] : (best.c.steps || []).join("\n"), citations: [{ card_id: best.c.id, step }] };
}

/* ---------- staff: ask ---------- */
async function ask(text) {
  text = text.trim();
  if (!text || ui.busy) return;
  ui.busy = true;
  const qid = uid("q");
  ui.session.push(qid);
  ui.pending[qid] = text;
  render(); scrollEnd();
  const rec = { text, askedAt: now(), outcome: null, cardIds: [], citations: [], answer: "", riskCategory: null, engine: "rule", by: me || null };
  try {
    const risk = detectRisk(text);
    if (risk) {
      rec.outcome = "escalated_risk"; rec.riskCategory = risk;
    } else {
      const approved = S.cards.filter((c) => c.status === "approved");
      let res = null;
      if (ai && approved.length) {
        try { res = await aiAnswer(text, approved); rec.engine = "ai"; }
        catch (e) { res = null; }
      }
      if (!res) { res = keywordAnswer(text, approved); rec.engine = "keyword"; }
      if (res && res.status === "risk") {
        rec.outcome = "escalated_risk";
        rec.riskCategory = ["환불", "위생·안전", "개인정보"].includes(res.risk_category) ? res.risk_category : "위생·안전";
      } else {
        const valid = (Array.isArray(res && res.citations) ? res.citations : [])
          .map((c) => ({ cardId: String(c.card_id || ""), step: Number.isInteger(c.step) ? c.step : null }))
          .filter((c) => { const card = approved.find((x) => x.id === c.cardId); return card && (c.step == null || (c.step >= 1 && c.step <= (card.steps || []).length)); });
        if (res && res.status === "answered" && String(res.answer || "").trim() && valid.length) {
          rec.outcome = "answered"; rec.answer = String(res.answer).trim(); rec.citations = valid;
          rec.cardIds = [...new Set(valid.map((c) => c.cardId))];
        } else {
          rec.outcome = "held";
        }
      }
    }
  } catch (e) {
    rec.outcome = "held";
  }
  delete ui.pending[qid];
  await put("questions", qid, rec);
  if (rec.outcome !== "answered") {
    await put("escalations", uid("e"), { questionId: qid, question: text, reason: rec.outcome === "held" ? "no_evidence" : "risk", riskCategory: rec.riskCategory, status: "open", createdAt: now(), answer: "", resolvedAt: null, cardId: null });
  }
  ui.busy = false;
  render(); scrollEnd();
}
function scrollEnd() { requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" })); }
async function escalateManually(q) {

function reasonChip(e) {

}
function inboxView() {
  const box = h("div", { class: "stack" });

function inboxItem(e) {

  const ta = h("textarea", { id: "ans-" + e.id, placeholder: "직원에게 보낼 답을 말하거나 적어 주세요" });

  ta.addEventListener("input", () => { ui.inboxText = ta.value; });

  p.append(h("div", { class: "row" },
    dict ? h("button", { class: "btn", onclick: () => toggleDictation(ta, (v) => { ui.inboxText = v; }) }, dictState === "listening" && dictTarget === ta.id ? "말하기 멈추기" : "말로 답하기") : null,
    h("button", { class: "btn primary", disabled: ui.resolving, onclick: async () => {
      const ans = (ui.inboxText || "").trim();
      if (!ans) return toast("답을 먼저 적어 주세요.");
      ui.resolving = true; render();

      if (ui.inboxMakeCard) { const card = await makeDraft(ans, e.question, "escalation"); cardId = card ? card.id : null; }
      await patch("escalations", e.id, { status: "resolved", answer: ans, resolvedAt: now(), cardId });
      ui.resolving = false; ui.inboxOpen = null; ui.inboxText = "";
      toast(cardId ? "직원에게 답했고, 카드 초안을 ‘승인 대기’에 넣었어요." : "직원에게 답했어요.");
      render();

  box.append(h("p", { class: "small muted", style: "margin:0" }, "직원이 ‘부족해요’를 누른 답변이에요. 반응 수로 답변 순위를 바꾸지 않고, 관리자가 카드를 고친 뒤에만 반영돼요."));

      h("div", { style: "font-weight:500" }, f.question),

        cards[0] ? h("button", { class: "btn primary", onclick: async () => { await patch("feedback", f.id, { status: "reviewed", reviewedAt: now() }); openEditor(cards[0]); } }, "카드 고치기") : null,
        h("button", { class: "btn", onclick: () => patch("feedback", f.id, { status: "reviewed", reviewedAt: now() }) }, "문제없음으로 닫기"))));
  }
  const helpful = {};
  S.feedback.filter((f) => f.helpful).forEach((f) => (f.cardIds || []).forEach((id) => { helpful[id] = (helpful[id] || 0) + 1; }));
  const rows = Object.entries(helpful).map(([id, n]) => [S.cards.find((c) => c.id === id), n]).filter(([c]) => c).sort((a, b) => b[1] - a[1]);
  if (rows.length) box.append(h("section", { class: "panel" }, h("h2", { style: "font-size:15px;margin-bottom:6px" }, "‘도움이 돼요’ 기록 (참고용)"),
    h("table", { class: "tbl" }, h("tbody", null, rows.map(([c, n]) => h("tr", null, h("td", null, c.title), h("td", { class: "n" }, n + "회")))))));
  return box;
}

/* ---------- metrics ---------- */
function citeCounts() {
  const m = {};
  S.questions.forEach((q) => (q.cardIds || []).forEach((id) => { m[id] = (m[id] || 0) + 1; }));
  return m;
}
function metricsView() {
  const Q = S.questions, E = S.escalations;
  const n = Q.length;
  const cnt = (o) => Q.filter((q) => q.outcome === o).length;
  const pct = (x) => n ? Math.round((x / n) * 100) + "%" : "-";
  const resolved = E.filter((e) => e.status === "resolved" && e.resolvedAt && e.createdAt);
  const avgMin = resolved.length ? Math.round(resolved.reduce((s, e) => s + (e.resolvedAt - e.createdAt), 0) / resolved.length / 60000) : null;
  const examples = Q.filter((q) => q.example).length;
  const box = h("div", { class: "stack" });
  if (examples) box.append(h("div", { class: "missing row" }, `예시 기록 ${examples}건이 섞여 있어요. 파일럿을 시작하기 전에 지우세요.`,
    h("button", { class: "btn", onclick: clearExamples }, "예시 기록 지우기")));
  const tile = (k, v, s) => h("div", { class: "tile" }, h("div", { class: "k" }, k), h("div", { class: "v" }, v), s ? h("div", { class: "s" }, s) : null);
  box.append(h("div", { class: "tiles" },
    tile("전체 질문", n, "직원이 앱에 물은 수"),
    tile("근거 있는 답변", pct(cnt("answered")), `${cnt("answered")}건`),
    tile("답변 보류", pct(cnt("held")), `근거 없음 ${cnt("held")}건`),
    tile("위험 질문 이관", pct(cnt("escalated_risk")), `${cnt("escalated_risk")}건`),
    tile("관리자 응답", avgMin == null ? "-" : avgMin < 60 ? avgMin + "분" : (avgMin / 60).toFixed(1) + "시간", "호출 후 답까지 평균"),
    tile("수정 후보", S.feedback.filter((f) => !f.helpful).length, "‘부족해요’ 누적")));
  box.append(dailyChart(Q));
  // top cards
  const cc = citeCounts();
  const top = Object.entries(cc).map(([id, k]) => [S.cards.find((c) => c.id === id), k]).filter(([c]) => c).sort((a, b) => b[1] - a[1]).slice(0, 5);
  box.append(h("section", { class: "panel" }, h("h2", { style: "font-size:15px;margin-bottom:6px" }, "가장 많이 찾은 업무카드"),
    top.length ? h("table", { class: "tbl" }, h("tbody", null, top.map(([c, k]) => h("tr", null, h("td", null, c.title), h("td", { class: "n" }, k + "회"))))) : h("p", { class: "small muted" }, "아직 기록이 없어요.")));
  // repeated questions
  const rep = {};
  Q.forEach((q) => { const k = norm(q.text); if (!k) return; (rep[k] = rep[k] || { text: q.text, n: 0 }).n++; });
  const reps = Object.values(rep).filter((r) => r.n >= 2).sort((a, b) => b.n - a.n).slice(0, 5);
  box.append(h("section", { class: "panel" }, h("h2", { style: "font-size:15px;margin-bottom:6px" }, "반복된 질문"),
    reps.length ? h("table", { class: "tbl" }, h("tbody", null, reps.map((r) => h("tr", null, h("td", null, r.text), h("td", { class: "n" }, r.n + "회"))))) : h("p", { class: "small muted", style: "margin:0" }, "같은 질문이 두 번 이상 나오면 여기에 보여요. 카드가 있는데도 반복되면 카드를 더 찾기 쉽게 고칠 차례예요.")));
  box.append(h("div", { class: "row" }, h("button", { class: "btn", onclick: exportCsv }, "질문 기록 CSV 내려받기"),
    h("span", { class: "small muted" }, "주별로 비교해 반복 질문·보류 비율이 줄어드는지 봅니다.")));
  return box;
}
function dailyChart(Q) {
  const days = 14, W = 340, H = 150, padL = 22, padR = 14, padB = 22, padT = 10;
  const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - (days - 1));
  const buckets = Array.from({ length: days }, () => ({ answered: 0, held: 0, escalated_risk: 0 }));
  Q.forEach((q) => { const i = Math.floor((q.askedAt - start.getTime()) / 864e5); if (i >= 0 && i < days && buckets[i][q.outcome] != null) buckets[i][q.outcome]++; });
  const max = Math.max(4, ...buckets.map((b) => b.answered + b.held + b.escalated_risk));
  const yMax = Math.ceil(max / 2) * 2;
  const bw = (W - padL - padR) / days;
  const y = (v) => padT + (H - padT - padB) * (1 - v / yMax);
  const NS = "http://www.w3.org/2000/svg";
  const s = (tag, a) => { const el = document.createElementNS(NS, tag); for (const k in a) el.setAttribute(k, a[k]); return el; };
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": "최근 14일 질문 수" });
  [0, yMax / 2, yMax].forEach((v) => {
    svg.append(s("line", { x1: padL, x2: W - padR, y1: y(v), y2: y(v), stroke: "var(--line)", "stroke-width": 1 }));
    const t = s("text", { x: padL - 5, y: y(v) + 3.5, "text-anchor": "end", "font-size": 9.5, fill: "var(--muted)", "font-family": "IBM Plex Mono, monospace" }); t.textContent = v; svg.append(t);
  });
  const colors = { answered: "var(--ok)", held: "var(--hold)", escalated_risk: "var(--risk)" };
  buckets.forEach((b, i) => {
    let acc = 0; const x = padL + i * bw + bw * 0.18, w = bw * 0.64;
    ["answered", "held", "escalated_risk"].forEach((k) => {
      if (!b[k]) return;
      const y0 = y(acc), y1 = y(acc + b[k]);
      svg.append(s("rect", { x, y: y1, width: w, height: Math.max(0, y0 - y1 - 1), fill: colors[k], rx: 1.5 }));
      acc += b[k];
    });
    if (i % 2 === 1 || i === days - 1) {
      const d = new Date(start.getTime() + i * 864e5);
      const t = s("text", { x: x + w / 2, y: H - 6, "text-anchor": "middle", "font-size": 9.5, fill: "var(--muted)", "font-family": "IBM Plex Mono, monospace" });
      t.textContent = `${d.getMonth() + 1}/${d.getDate()}`; svg.append(t);
    }
  });
  return h("section", { class: "panel stack" }, h("h2", { style: "font-size:15px" }, "최근 14일 질문"),
    h("div", { class: "legend" }, h("span", null, h("i", { style: "background:var(--ok)" }), "근거 답변"), h("span", null, h("i", { style: "background:var(--hold)" }), "보류"), h("span", null, h("i", { style: "background:var(--risk)" }), "위험 이관")),
    h("div", { style: "overflow-x:auto" }, svg));
}
async function clearExamples() {
  const ids = S.questions.filter((q) => q.example).map((q) => q.id);
  for (const coll of ["escalations", "feedback"]) for (const x of S[coll].filter((x) => x.example || ids.includes(x.questionId))) await remove(coll, x.id);
  for (const id of ids) await remove("questions", id);
  toast("예시 기록을 지웠어요.");
}
async function exportCsv() {
  const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const outcomeKo = { answered: "근거 답변", held: "보류", escalated_risk: "위험 이관" };
  const rows = [["일시", "질문", "결과", "위험 분류", "근거 카드", "AI 답", "관리자 답", "관리자 응답(분)", "피드백", "예시"]];
  [...S.questions].sort((a, b) => a.askedAt - b.askedAt).forEach((q) => {
    const e = S.escalations.find((x) => x.questionId === q.id);
    const f = S.feedback.find((x) => x.questionId === q.id);
    const cards = (q.cardIds || []).map((id) => (S.cards.find((c) => c.id === id) || {}).title || id).join(" / ");
    const d = new Date(q.askedAt);
    rows.push([`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`,
      q.text, outcomeKo[q.outcome] || q.outcome, q.riskCategory || "", cards, q.answer || "", e && e.answer || "",
      e && e.resolvedAt ? Math.round((e.resolvedAt - e.createdAt) / 60000) : "", f ? (f.helpful ? "도움이 돼요" : "부족해요") : "", q.example ? "예시" : ""]);
  });
  const csv = "﻿" + rows.map((r) => r.map(esc).join(",")).join("\r\n");
  if (!dl && STANDALONE) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = "질문기록.csv"; document.body.append(a); a.click(); a.remove();
    return;
  }
  if (!dl) return toast("이 화면에서는 파일을 내려받을 수 없어요.");
  try { await dl.save({ filename: "질문기록.csv", data: csv }); }
  catch (e) { if (!e || e.code !== "declined") toast("파일을 저장하지 못했어요."); }
}

/* ---------- dictation ---------- */
let dictState = "idle", dictTarget = null, dictSink = null, micUsed = false;
function toggleDictation(ta, onChange) {
  if (!dict) return;
  if (dictState !== "idle" && dictTarget === ta.id) { dict.stop().catch(() => {}); return; }
  dictTarget = ta.id; dictSink = { id: ta.id, onChange };
  micUsed = true;
  dict.start({ language: "ko" }).catch((e) => {
    if (e && e.code === "not_granted") { dict = null; toast("마이크를 쓸 수 없어서 글로 적어 주세요."); render(); }
  });
}
function appendDictation(text) {
  if (!dictSink) return;
  const el = document.getElementById(dictSink.id);
  const base = el ? el.value : "";
  const v = base ? base + text : text.replace(/^\s+/, "");
  if (el) el.value = v;
  dictSink.onChange(v);
}

/* ---------- wiring ---------- */
$("#roleStaff").addEventListener("click", () => { ui.editing = null; go("staff"); });
$("#roleAdmin").addEventListener("click", () => go("admin"));
document.querySelectorAll("#adminTabs button").forEach((b) => b.addEventListener("click", () => { ui.editing = null; go("admin", b.dataset.tab); }));
const askInput = $("#askInput");
askInput.addEventListener("input", () => { askInput.style.height = "auto"; askInput.style.height = Math.min(140, askInput.scrollHeight) + "px"; });
askInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("#sendBtn").addEventListener("click", send);
function send() { const t = askInput.value; askInput.value = ""; askInput.style.height = "auto"; if (dictState !== "idle") dict.stop().catch(() => {}); ask(t); }
$("#micBtn").addEventListener("click", () => {
  if (!dict) return;
  if (dictState !== "idle") { dict.stop().catch(() => {}); return; }
  dictTarget = "askInput"; dictSink = { id: "askInput", onChange: () => {} };
  dict.start({ language: "ko" }).catch((e) => { if (e && e.code === "not_granted") { dict = null; render(); } });
});
window.addEventListener("hashchange", () => { routeFromHash(); render(); });
setInterval(() => { if (ui.role === "admin" && !document.activeElement.matches("textarea,input")) render(); }, 60000);

routeFromHash();
render();
initStore();
if (STANDALONE) ai = MOCK_AI; else use("sample").then((s) => { ai = s; render(); });
use("downloads").then((d) => { dl = d; });
use("user").then(async (u) => {
  if (!u) return;
  try { me = await u.id(); } catch (_) {}
  try { isMgr = !!(await u.canEdit()); } catch (_) { isMgr = false; }
  if (!isMgr) { ui.role = "staff"; ui.editing = null; } else routeFromHash();
  render();
});
use("dictation").then((d) => {
  dict = d;
  if (!d) return render();
  d.onFinal(({ text }) => appendDictation(text));
  d.onState(({ state }) => {
    dictState = state;
    const mic = $("#micBtn");
    mic.classList.toggle("live", state !== "idle" && dictTarget === "askInput");
    mic.setAttribute("aria-label", state !== "idle" && dictTarget === "askInput" ? "말하기 멈추기" : "말로 질문하기");
    if (dictTarget !== "askInput") render();
    if (state === "idle" && dictTarget === "askInput" && askInput.value.trim()) askInput.focus();
  });
  render();
});
})();
